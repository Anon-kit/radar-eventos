name: radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Enviar relatório de diagnóstico das plataformas"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rodar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_FEEDS: ${{ secrets.ALERT_FEEDS }}
          FORCE_PROBE: ${{ inputs.probe }}
        run: python3 radar.py

      - name: Salvar memória (state)
        if: always()
        run: |
          mkdir -p state
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || (git commit -m "state" && git push)
